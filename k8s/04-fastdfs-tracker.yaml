---
apiVersion: v1
kind: Service
metadata:
  name: fastdfs-tracker-svc
spec:
  selector:
    app: fastdfs-tracker
  ports:
    - port: 22122
      targetPort: 22122
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastdfs-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastdfs-tracker
  template:
    metadata:
      labels:
        app: fastdfs-tracker
    spec:
      containers:
        - name: fastdfs-tracker
          image: placeholder/fastdfs-tracker:latest
          ports:
            - containerPort: 22122
          env:
            # Improved load balancing algorithm configuration
            # Considers disk performance and task utilization in addition to remaining space
            - name: FDFS_STORE_LOOKUP
              value: "2"  # 0: round robin, 1: max free space, 2: improved load balancing
            - name: FDFS_STORE_GROUP
              value: "0"  # Which group to store files (0: auto select)
          volumeMounts:
            - name: tracker-storage
              mountPath: /var/fdfs
      volumes:
        - name: tracker-storage
          persistentVolumeClaim:
            claimName: fastdfs-tracker-pvc
