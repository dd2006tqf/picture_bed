---
apiVersion: v1
kind: Service
metadata:
  name: fastdfs-storage-svc
spec:
  clusterIP: None
  selector:
    app: fastdfs-storage
  ports:
    - port: 23000
      targetPort: 23000
      name: http
    - port: 22000
      targetPort: 22000
      name: storage
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fastdfs-storage
spec:
  serviceName: fastdfs-storage-svc
  replicas: 2
  selector:
    matchLabels:
      app: fastdfs-storage
  template:
    metadata:
      labels:
        app: fastdfs-storage
    spec:
      containers:
        - name: fastdfs-storage
          image: placeholder/fastdfs-storage:latest
          ports:
            - containerPort: 23000
              name: http
            - containerPort: 22000
              name: storage
          env:
            - name: TRACKER_SERVER
              value: "fastdfs-tracker-svc:22122"
            # Enable performance monitoring for improved load balancing
            - name: FDFS_DISK_STAT_INTERVAL
              value: "60"  # Disk performance statistics interval (seconds)
            - name: FDFS_SYNC_STAT_INTERVAL
              value: "300"  # Sync statistics interval (seconds)
          volumeMounts:
            - name: storage-data
              mountPath: /var/fdfs
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
      volumes:
        - name: storage-data
          persistentVolumeClaim:
            claimName: fastdfs-storage-pvc
