---
apiVersion: v1
kind: Service
metadata:
  name: ai-search-svc
spec:
  selector:
    app: ai-search
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-search
  template:
    metadata:
      labels:
        app: ai-search
    spec:
      containers:
        - name: ai-search
          image: placeholder/ai-search:latest
          ports:
            - containerPort: 8080
          env:
            - name: MYSQL_HOST
              value: "mysql-svc"
            - name: MYSQL_PORT
              value: "3306"
            - name: REDIS_HOST
              value: "redis-svc"
            - name: REDIS_PORT
              value: "6379"
